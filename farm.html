<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Ewe Beauty Farming Co</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a href="index.html" id="backToGames" class="back-games">‹ Games</a>
  <canvas id="game"></canvas>

  <!-- HUD in the sky: big money/wool + food/water gauges -->
  <div id="farmHud" class="hud farm-hud">
    <div class="hud-row">
      <div class="hud-pill money" id="fMoney">💰 0</div>
      <div class="hud-pill" id="fWool">🧺 0</div>
      <div class="hud-pill" id="fSheep">🐑 0</div>
      <div class="hud-pill" id="fLevel">Lv 1</div>
      <div class="hud-spacer"></div>
      <button class="hud-mini" id="btnSound" title="Sound">🔊</button>
      <button class="hud-mini" id="btnHelp" title="How to play">?</button>
    </div>
    <div class="gauges">
      <div class="gauge">
        <span class="g-ic">🌾</span>
        <div class="g-track"><div id="foodFill" class="g-fill food"></div></div>
        <span class="g-pct" id="foodPct">60%</span>
      </div>
      <div class="gauge">
        <span class="g-ic">💧</span>
        <div class="g-track"><div id="waterFill" class="g-fill water"></div></div>
        <span class="g-pct" id="waterPct">60%</span>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Woofa herd button -->
  <button id="btnWoofa" class="woofa-btn"><span class="woofa-emoji">🐾</span><span class="woofa-lbl">WOOFA</span></button>

  <!-- bottom action bar -->
  <div id="farmBar" class="farm-bar">
    <button class="fbtn" id="btnFeed"><span class="fb-emoji">🌾</span><span class="fb-lbl">Feed</span><span class="fb-cost" id="feedCost">$8</span></button>
    <button class="fbtn" id="btnWater"><span class="fb-emoji">💧</span><span class="fb-lbl">Water</span><span class="fb-cost" id="waterCost">$3</span></button>
    <button class="fbtn" id="btnSell"><span class="fb-emoji">🧺</span><span class="fb-lbl">Sell wool</span><span class="fb-cost" id="sellVal">$0</span></button>
    <button class="fbtn" id="btnShop"><span class="fb-emoji">🛒</span><span class="fb-lbl">Shop</span></button>
  </div>

  <!-- start / animated intro -->
  <div id="startScreen" class="overlay intro-overlay">
    <div class="intro-sky">
      <span class="intro-cloud c1">☁️</span>
      <span class="intro-cloud c2">☁️</span>
      <span class="intro-dog">🐕</span>
    </div>
    <div class="panel intro-panel">
      <div class="intro-flock">
        <span class="ifs s1">🐑</span><span class="ifs s2">🐑</span><span class="ifs s3">🐏</span><span class="ifs s4">🐑</span>
      </div>
      <h1 class="intro-title">EWE BEAUTY<span>FARMING Co</span></h1>
      <p class="intro-tag">Raise sheep · grow wool · build the farm 🚜</p>
      <button class="btn btn-primary intro-play" id="farmPlay">START FARMING</button>
    </div>
  </div>

  <!-- tutorial coach -->
  <div id="tutOverlay" class="overlay tut-overlay hidden">
    <div class="tut-card">
      <div class="tut-step" id="tutStep">1 / 6</div>
      <p class="tut-text" id="tutText"></p>
      <div class="tut-btns">
        <button class="btn-ghost tut-skip" id="tutSkip">Skip</button>
        <button class="btn btn-primary tut-next" id="tutNext">Next ›</button>
      </div>
    </div>
  </div>

  <!-- shop -->
  <div id="shopScreen" class="overlay hidden">
    <div class="panel panel-wide">
      <div class="shop-head">
        <h2>Farm Shop</h2>
        <div class="shop-coins">💰 <span id="shopMoney">0</span></div>
      </div>
      <div id="shopList" class="shop-list"></div>
      <button class="btn btn-primary" id="shopClose">Back to the farm</button>
    </div>
  </div>

  <script src="farm.js"></script>
</body>
</html>
