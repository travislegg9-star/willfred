<!doctype html>
<html lang="en" class="wrestling-page">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Sheep Wrestling — Woofa's Games</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css?v=56" />
  <style>
    :root {
      --w-bg: #0b1220;
      --w-surface: #121a2b;
      --w-surface2: #1a2438;
      --w-border: #2a3548;
      --w-fg: #eef2ff;
      --w-muted: #8b95a8;
      --w-primary: #e8a838;
      --w-primary-fg: #1a1204;
      --w-accent: #4bc0e0;
      --w-good: #58e08a;
      --w-ram: #c45c2a;
      --w-nav-h: 64px;
    }
    /* Kill shared canvas-game lock from style.css */
    html.wrestling-page, html.wrestling-page body, body.wrestling-page {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-height: 100% !important;
      overflow: hidden !important;
      background: var(--w-bg) !important;
      color: var(--w-fg) !important;
      touch-action: manipulation !important;
      overscroll-behavior: none !important;
      position: fixed !important;
      inset: 0 !important;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }
    /* Full-viewport app shell */
    #wApp {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
      background: var(--w-bg);
      z-index: 1;
    }
    #wApp.fight-mode .w-top,
    #wApp.fight-mode #wNav { display: none !important; }
    #wApp.fight-mode #wScroll { display: none !important; }

    .w-top {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top, 0px));
      background: rgba(11,18,32,.96);
      border-bottom: 1px solid var(--w-border);
      z-index: 5;
    }
    .w-top a { color: var(--w-muted); text-decoration: none; font-size: 12px; font-weight: 700; }
    .w-top-title { text-align: center; }
    .w-top-title .lab { font-size: 10px; font-weight: 800; letter-spacing: .14em; color: var(--w-primary); text-transform: uppercase; }
    .w-top-title .sub { font-size: 11px; color: var(--w-muted); }
    .w-pills { display: flex; gap: 6px; }
    .w-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--w-surface2); border-radius: 999px; padding: 4px 10px;
      font-size: 13px; font-weight: 800; color: var(--w-primary);
    }
    .w-pill.troph { color: var(--w-accent); }

    
    /* Hide scrollbars — keep scroll working (touch / trackpad / wheel) */
    html.wrestling-page, body.wrestling-page, #wApp, #wScroll {
      scrollbar-width: none !important;          /* Firefox */
      -ms-overflow-style: none !important;       /* legacy Edge */
    }
    html.wrestling-page::-webkit-scrollbar,
    body.wrestling-page::-webkit-scrollbar,
    #wApp::-webkit-scrollbar,
    #wScroll::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
      background: transparent !important;
    }

    /* THE scroll surface — this is what the finger moves */
    #wScroll {
      flex: 1 1 auto;
      min-height: 0 !important;
      width: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
      touch-action: pan-y !important;
      overscroll-behavior-y: contain;
      box-sizing: border-box;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    #wScroll::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
    /* Center the actual content column inside the full-bleed scrollport */
    #wMain {
      padding: 12px 12px calc(var(--w-nav-h) + 20px + env(safe-area-inset-bottom, 0px));
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      min-height: min-content;
    }

    .w-nav {
      flex: 0 0 auto;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      background: rgba(18,26,43,.98);
      border-top: 1px solid var(--w-border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .w-nav-inner { max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; padding: 6px 4px; }
    .w-nav button {
      background: none; border: 0; color: var(--w-muted); font-size: 10px; font-weight: 800;
      display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 10px; min-width: 56px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .w-nav button.on { color: var(--w-primary); }
    .w-nav .ico { font-size: 18px; line-height: 1; }

    .w-card {
      background: var(--w-surface); border: 1px solid var(--w-border); border-radius: 16px;
      padding: 12px; margin-bottom: 10px;
    }
    .w-card.sel { border-color: var(--w-primary); box-shadow: 0 0 0 1px var(--w-primary); background: rgba(232,168,56,.08); }
    .w-hero {
      background: linear-gradient(145deg, rgba(196,92,42,.35), var(--w-surface) 50%, var(--w-surface2));
      border: 1px solid var(--w-border); border-radius: 20px; padding: 18px; margin-bottom: 12px;
    }
    .w-hero h1 { margin: 8px 0 6px; font-size: 24px; font-weight: 900; letter-spacing: -0.02em; }
    .w-hero p { margin: 0; color: var(--w-muted); font-size: 14px; line-height: 1.45; }
    .w-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .w-btn {
      appearance: none; border: 0; cursor: pointer; border-radius: 12px;
      padding: 11px 14px; font-weight: 800; font-size: 13px;
      background: var(--w-primary); color: var(--w-primary-fg);
    }
    .w-btn:active { transform: scale(.98); }
    .w-btn.ghost { background: rgba(255,255,255,.06); color: var(--w-fg); border: 1px solid var(--w-border); }
    .w-btn.block { width: 100%; display: block; }
    .w-btn.sm { padding: 6px 10px; font-size: 11px; border-radius: 8px; background: transparent; color: var(--w-fg); border: 1px solid var(--w-border); }
    .w-btn.good { background: rgba(88,224,138,.15); color: var(--w-good); border: 1px solid rgba(88,224,138,.35); }
    .w-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .w-statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .w-stat { background: rgba(0,0,0,.35); border-radius: 10px; padding: 6px; text-align: center; }
    .w-stat .k { font-size: 10px; font-weight: 800; color: var(--w-muted); letter-spacing: .04em; }
    .w-stat .v { font-size: 14px; font-weight: 900; }
    .w-sheep { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; }
    .w-av {
      width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0; border: 2px solid #444;
    }
    .w-meta { min-width: 0; flex: 1; }
    .w-meta .name { font-weight: 800; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .w-meta .sub { font-size: 12px; color: var(--w-muted); margin-top: 2px; }
    .w-list-btn {
      width: 100%; display: flex; gap: 10px; align-items: center; text-align: left;
      background: var(--w-surface); border: 1px solid var(--w-border); border-radius: 16px;
      padding: 12px; margin-bottom: 8px; color: inherit; cursor: pointer;
    }
    .w-list-btn:active { border-color: var(--w-primary); }
    .w-list-btn .go { color: var(--w-muted); font-weight: 800; }
    .w-h2 { margin: 0 0 4px; font-size: 18px; font-weight: 900; }
    .w-muted { color: var(--w-muted); font-size: 12px; }
    .w-section-lab { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--w-muted); margin: 14px 0 8px; }
    input.w-input, textarea.w-input {
      width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--w-border);
      background: var(--w-bg); color: var(--w-fg); padding: 10px 12px; font-size: 14px; font-family: inherit;
    }
    textarea.w-input { min-height: 88px; font-family: ui-monospace, monospace; font-size: 11px; }
    .w-code { word-break: break-all; font-family: ui-monospace, monospace; font-size: 11px; color: var(--w-accent); background: var(--w-bg); border: 1px solid var(--w-border); border-radius: 12px; padding: 10px; }
    #wToast {
      position: fixed; left: 50%; bottom: calc(var(--w-nav-h) + 16px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--w-surface2); border: 1px solid rgba(232,168,56,.45); color: var(--w-fg);
      padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
      z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center;
    }
    #wToast.show { opacity: 1; }
    #wFight {
      position: fixed; inset: 0; z-index: 50; background: #060a12; display: none; flex-direction: column;
    }
    #wFight.on { display: flex; }
    #wArenaWrap { flex: 1; position: relative; min-height: 0; }
    #wArena { width: 100%; height: 100%; display: block; }
    .w-fight-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 10px 12px; background: rgba(0,0,0,.55); border-bottom: 1px solid var(--w-border);
    }
    .w-fight-bar .name { font-weight: 800; font-size: 13px; }
    .w-hp { height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 4px; width: 110px; }
    .w-hp > i { display: block; height: 100%; background: linear-gradient(90deg, #e84a3a, #e8a838); width: 100%; }
    .w-hp.r > i { background: linear-gradient(90deg, #4bc0e0, #58e08a); }
    .w-fight-actions { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; background: rgba(0,0,0,.6); }
    #wResult {
      display: none; position: fixed; inset: 0; z-index: 55; background: rgba(6,10,18,.88);
      align-items: center; justify-content: center; padding: 20px;
    }
    #wResult.on { display: flex; }
    .w-result-panel {
      width: min(400px, 100%); background: var(--w-surface); border: 1px solid var(--w-border);
      border-radius: 20px; padding: 20px; text-align: center;
    }
    .w-result-panel h2 { margin: 0 0 8px; font-size: 28px; font-weight: 900; }
    .w-result-panel p { color: var(--w-muted); margin: 0 0 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="wrestling-page">
  <div id="wApp">
    <header class="w-top">
      <a href="index.html">‹ Games</a>
      <div class="w-top-title">
        <div class="lab">Sheep Wrestling</div>
        <div class="sub" id="wPlayerSub">Farmer's stable</div>
      </div>
      <div class="w-pills">
        <span class="w-pill" id="wCoins">🪙 0</span>
        <span class="w-pill troph" id="wTrophies">🏆 0</span>
      </div>
    </header>
    <div id="wScroll"><main class="w-main" id="wMain"></main></div>
    <nav class="w-nav" id="wNav">
      <div class="w-nav-inner">
        <button type="button" data-screen="home" class="on"><span class="ico">🏠</span>Home</button>
        <button type="button" data-screen="stable"><span class="ico">🐑</span>Stable</button>
        <button type="button" data-screen="train"><span class="ico">💪</span>Train</button>
        <button type="button" data-screen="shop"><span class="ico">🛒</span>Shop</button>
        <button type="button" data-screen="arena"><span class="ico">⚔️</span>Arena</button>
      </div>
    </nav>
  </div>

  <div id="wToast"></div>

  <div id="wFight">
    <div class="w-fight-bar">
      <div>
        <div class="name" id="wLName">You</div>
        <div class="w-hp"><i id="wLHp"></i></div>
      </div>
      <div style="font-weight:900;color:var(--w-primary);font-size:12px">SMASH</div>
      <div style="text-align:right">
        <div class="name" id="wRName">Rival</div>
        <div class="w-hp r" style="margin-left:auto"><i id="wRHp"></i></div>
      </div>
    </div>
    <div id="wArenaWrap"><canvas id="wArena"></canvas></div>
    <div class="w-fight-actions">
      <button type="button" class="w-btn ghost block" id="wSkipFight">Skip to result ›</button>
    </div>
  </div>

  <div id="wResult">
    <div class="w-result-panel">
      <div id="wResultEmoji" style="font-size:48px">🐏</div>
      <h2 id="wResultTitle">WIN</h2>
      <p id="wResultBody"></p>
      <button type="button" class="w-btn block" id="wResultOk">Back to Arena</button>
    </div>
  </div>

    <script src="wrestling.js?v=56"></script>
  <script>
    (function () {
      // Force SW update + claim fresh assets
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.update(); });
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js?v=56').catch(function () {});
        });
      }
      // If game script failed, main stays empty — recover hard
      function recover() {
        var main = document.getElementById('wMain');
        if (!main) return;
        if (main.innerHTML && main.innerHTML.trim().length > 20) return;
        main.innerHTML =
          '<div class="w-hero"><h1>Update needed</h1>' +
          '<p style="color:var(--w-muted);margin:8px 0 14px">Your phone held an old broken file. Tap below to load the real game.</p>' +
          '<button type="button" class="w-btn block" id="wForceReload">Reload Sheep Wrestling</button>' +
          '<button type="button" class="w-btn ghost block" id="wNukeCache" style="margin-top:8px">Clear cache & reload</button></div>';
        var a = document.getElementById('wForceReload');
        var b = document.getElementById('wNukeCache');
        if (a) a.onclick = function () {
          location.replace('wrestling.html?v=' + Date.now());
        };
        if (b) b.onclick = function () {
          var done = function () { location.replace('wrestling.html?v=' + Date.now()); };
          if (!('serviceWorker' in navigator)) return done();
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () {
            if (!window.caches) return;
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          }).then(done).catch(done);
        };
      }
      setTimeout(recover, 600);
      setTimeout(recover, 2000);
    })();
  </script>
</body>
</html>
